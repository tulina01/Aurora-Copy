[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# PDFKit loads Helvetica AFM / ICC files from disk at runtime. Netlify's default
# bundle tracing often omits those assets, so invoice/receipt generation works
# on localhost (full node_modules) but fails in the deployed function.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit", "fontkit", "linebreak", "png-js", "jpeg-exif", "@netlify/blobs"]
  included_files = [
    "node_modules/pdfkit/js/data/**",
    "node_modules/fontkit/src/opentype/shapers/**",
    "node_modules/png-js/**",
    "images/aurora-logo.png",
    "images/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
